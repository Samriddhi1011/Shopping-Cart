<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechStore - Smart Cart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <div class="container nav-content">
      <div class="brand">Tech<span>Store</span></div>
      
      <div class="nav-actions">
        <button id="themeToggleBtn" class="btn-icon" title="Switch Theme">🌙</button>
        <button id="openModalBtn" class="btn-outline">+ Add Product</button>
        <a href="#cartSection" class="cart-badge">
          Cart <span id="cartCount">0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="container main-layout">

    <section class="catalog-section">
      <div class="section-header">
        <h2>Available Products</h2>
        <div class="filters">
          <input type="text" id="searchInput" placeholder="Search gadgets...">
          <select id="categoryFilter">
            <option value="all">All Categories</option>
            <option value="Audio">Audio</option>
            <option value="Accessories">Accessories</option>
            <option value="Wearables">Wearables</option>
          </select>
        </div>
      </div>

      <div id="productGrid" class="product-grid"></div>
    </section>

    <aside id="cartSection" class="cart-section">
      <div class="cart-card">
        <div class="cart-header">
          <h3>Your Cart</h3>
          <button id="clearCartBtn" class="text-btn">Clear all</button>
        </div>

        <div id="cartItems" class="cart-items"></div>

        <div class="promo-box">
          <input type="text" id="promoInput" placeholder="Promo code (e.g. SAVE10)">
          <button id="applyPromoBtn" class="btn-dark">Apply</button>
        </div>
        <p id="promoMsg" class="promo-msg"></p>

        <div class="bill-details">
          <div class="bill-row">
            <span>Subtotal</span>
            <span id="subtotalText">₹0</span>
          </div>
          <div class="bill-row discount-row" id="discountRow" style="display: none;">
            <span>Discount</span>
            <span id="discountText">-₹0</span>
          </div>
          <div class="bill-row">
            <span>GST (18%)</span>
            <span id="taxText">₹0</span>
          </div>
          <hr>
          <div class="bill-row total-row">
            <span>Total Payable</span>
            <span id="totalText">₹0</span>
          </div>
        </div>

        <button id="checkoutBtn" class="btn-primary checkout-btn" disabled>
          Proceed to Checkout
        </button>
      </div>
    </aside>

  </main>

  <div id="productModal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-top">
        <h3>Add New Product</h3>
        <button id="closeModalBtn" class="close-btn">&times;</button>
      </div>
      
      <form id="addProductForm">
        <div class="form-group">
          <label>Product Name</label>
          <input type="text" id="pName" required placeholder="e.g. Mechanical Keyboard">
        </div>
        <div class="form-group">
          <label>Price (₹)</label>
          <input type="number" id="pPrice" required min="1" placeholder="e.g. 3499">
        </div>
        <div class="form-group">
          <label>Category</label>
          <select id="pCategory">
            <option value="Audio">Audio</option>
            <option value="Accessories">Accessories</option>
            <option value="Wearables">Wearables</option>
          </select>
        </div>
        <div class="form-group">
          <label>Image URL (Optional)</label>
          <input type="url" id="pImage" placeholder="https://...">
        </div>
        <button type="submit" class="btn-primary full-width">Save to Store</button>
      </form>
    </div>
  </div>

  <div id="toast" class="toast">Order placed successfully!</div>

  <script src="script.js"></script>
</body>
</html>
